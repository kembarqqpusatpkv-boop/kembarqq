<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>kembarqqgacor</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron',sans-serif;
    background:radial-gradient(circle at top,#2b2b2b,#000 70%);
    color:#c0c0c0;
    overflow-x:hidden;
    min-height:100vh;
    position:relative;
}

/* =========================
   GRID BACKGROUND
========================= */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;

    background:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);

    background-size:40px 40px;
    animation:gridMove 10s linear infinite;
}

@keyframes gridMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(40px);
    }
}

/* =========================
   PARTICLES
========================= */
#particles{
    position:fixed;
    inset:0;
    z-index:1;
}

.particle{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fff;

    box-shadow:
        0 0 10px #fff,
        0 0 20px #c0c0c0;

    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* =========================
   CONTAINER
========================= */
.container{
    position:relative;
    z-index:2;
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

/* =========================
   TOPBAR
========================= */
.topbar{
    margin-bottom:20px;
    padding:12px;

    text-align:center;
    color:#fff;

    border:1px solid rgba(192,192,192,.3);
    border-radius:12px;

    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);

    animation:blink 2s infinite;
}

@keyframes blink{
    50%{
        opacity:.6;
    }
}

/* =========================
   SLIDER
========================= */
.banner-slider{
    position:relative;
    overflow:hidden;

    width:100%;
    margin-bottom:30px;

    border-radius:20px;
    border:1px solid rgba(192,192,192,.3);
}

.slides{
    position:relative;
    height:320px;
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;

    opacity:0;
    transition:opacity .8s ease;
}

.slide.active{
    opacity:1;
    z-index:1;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
}

/* =========================
   SLIDER BUTTON
========================= */
.slider-btn{
    position:absolute;
    top:50%;
    z-index:5;

    padding:10px 15px;

    border:none;
    border-radius:10px;

    font-size:22px;
    cursor:pointer;

    color:#fff;
    background:rgba(0,0,0,.5);

    transform:translateY(-50%);
    transition:.3s;
}

.slider-btn:hover{
    background:#fff;
    color:#000;
}

.prev{
    left:10px;
}

.next{
    right:10px;
}

/* =========================
   CONTENT
========================= */
.content{
    display:grid;
    grid-template-columns:1fr 320px;
    align-items:center;
    gap:40px;
}

/* =========================
   LEFT SECTION
========================= */
.left{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

/* =========================
   LOGO
========================= */
.logo{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:20px;

    font-size:80px;
    font-weight:900;
    letter-spacing:4px;
    text-align:center;

    text-shadow:
    0 0 10px rgba(255,255,255,.8),
    0 0 20px rgba(192,192,192,.7),
    0 0 40px rgba(255,255,255,.5);
    background:linear-gradient(180deg,#fff,#aaa,#fff);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* =========================
   DESCRIPTION
========================= */
.desc{
    width:100%;
    max-width:700px;

    padding:20px;
    line-height:1.8;

    border-radius:20px;
    border:1px solid rgba(192,192,192,.2);

    background:rgba(255,255,255,.04);
}

/* =========================
   STATS
========================= */
.stats{
    width:100%;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;

    margin-top:20px;
}

.stat-box{
    min-width:160px;

    padding:15px 20px;

    text-align:center;

    border-radius:15px;
    border:1px solid rgba(192,192,192,.2);

    background:rgba(255,255,255,.03);
}

.stat-box h2{
    color:#fff;
    margin-bottom:5px;
}

/* =========================
   RIGHT SECTION
========================= */
.right{
    width:320px;

    display:flex;
    flex-direction:column;
    gap:15px;
}

/* =========================
   BUTTON
========================= */
.btn{
    display:block;

    padding:16px;

    text-align:center;
    text-decoration:none;
    font-weight:700;
    color:#fff;

    border-radius:15px;
    border:1px solid #c0c0c0;

    background:linear-gradient(145deg,#1a1a1a,#000);

    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);

    background:#fff;
    color:#000;

    box-shadow:
        0 0 15px rgba(255,255,255,.4),
        0 0 30px rgba(255,255,255,.2);
}

/* =========================
   FOOTER
========================= */
footer{
    margin-top:50px;
    padding:20px;

    text-align:center;
    color:#aaa;

    border-top:1px solid rgba(192,192,192,.2);
}

/* =========================
   MOBILE
========================= */
@media(max-width:900px){

    .content{
        grid-template-columns:1fr;
    }

    .right{
        width:100%;
    }

    .logo{
        font-size:50px;
    }

    .slides{
        height:220px;
    }

    .desc{
        font-size:14px;
    }
}

.btn{
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:"";
    position:absolute;
    inset:-2px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );

    transform:translateX(-100%);
    transition:.6s;
}

.btn:hover::before{
    transform:translateX(100%);
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles"></div>

<div class="container">

    <!-- TOPBAR -->


    <!-- SLIDER -->
    <div class="banner-slider">

        <div class="slides">

            <div class="slide active">
                <img src="banner.png" alt="Banner 1">
            </div>

            <div class="slide">
                <img src="banner2.png" alt="Banner 2">
            </div>

            <div class="slide">
                <img src="banner3.png" alt="Banner 3">
            </div>

        </div>

        <button class="slider-btn prev">&#10094;</button>
        <button class="slider-btn next">&#10095;</button>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- LEFT -->
        <div class="left">

            <div class="logo">
                KEMBARQQ
            </div>

            <div class="stats">

                <div class="stat-box">
                    <h2>24 JAM</h2>
                    <p>PELAYANAN</p>
                </div>

                <div class="stat-box">
                    <h2>100%</h2>
                    <p>TERPERCAYA</p>
                </div>

                <div class="stat-box">
                    <h2>TANPA</h2>
                    <p>BOT</p>
                </div>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="right">

            <a class="btn" href="https://pkvrtp.dpnel.com/" target="_blank">
                RTP & MEJA HOKI
            </a>

            <a class="btn" href="https://kembarqqjitu.org/" target="_blank">
                LOGIN MEMBER
            </a>

            <a class="btn" href="https://10fr4ame-b3stweeb.xyz/kembarqq/promosi/" target="_blank">
                INFO PROMO
            </a>

            <a class="btn" href="https://kembarqqjitu.org/Register.aspx?lang=id" target="_blank">
                DAFTAR SEKARANG
            </a>

        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 KEMBARQQ
    </footer>

</div>

<script>
/* =========================
   PARTICLES
========================= */
const particles = document.getElementById("particles");

for(let i = 0; i < 35; i++){

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "vw";
    particle.style.top = Math.random() * 100 + "vh";
    particle.style.animationDuration =
        (3 + Math.random() * 5) + "s";

    particles.appendChild(particle);
}

/* =========================
   SLIDER
========================= */
let currentSlide = 0;

const slides = document.querySelectorAll(".slide");

function showSlide(index){

    slides.forEach(slide => {
        slide.classList.remove("active");
    });

    slides[index].classList.add("active");
}

function nextSlide(){

    currentSlide =
        (currentSlide + 1) % slides.length;

    showSlide(currentSlide);
}

function prevSlide(){

    currentSlide =
        (currentSlide - 1 + slides.length) % slides.length;

    showSlide(currentSlide);
}

document
    .querySelector(".next")
    .addEventListener("click", nextSlide);

document
    .querySelector(".prev")
    .addEventListener("click", prevSlide);

/* AUTO SLIDE */
setInterval(nextSlide, 4000);
</script>

</body>
</html>
